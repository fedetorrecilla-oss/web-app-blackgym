# Render Blueprint for the Gym Turnos API backend.
#
# In the Render dashboard: New + > Blueprint > pick this repo > Render
# reads this file and proposes the service below automatically. The two
# secret values (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) are intentionally
# left blank here (sync: false) — Render will prompt for them once during
# setup, and they're stored only in Render's dashboard, never in this repo.
#
# Render has native Bun support: since expo/bun.lock exists in this repo,
# Render automatically makes a `bun` binary available on PATH for this
# service, no manual install needed. (An earlier version of this file
# curl-installed Bun into $HOME during the build step, but Render's build
# and run steps don't share $HOME, so that binary was missing by the time
# the service actually started — "No such file or directory". Relying on
# the native runtime avoids that entirely.)
services:
  - type: web
    name: blackgym-api
    runtime: node
    rootDir: expo
    buildCommand: bun install --ignore-scripts
    startCommand: bun run backend/server.ts
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
