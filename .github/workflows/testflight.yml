      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Apply RN TurboModule crash patch (explicit, fail-fast)
        run: node scripts/patch-rn-turbomodule.js

      - name: Verify the patch actually landed before pod install
        run: |
          grep -q "BLACKGYM_CAPTURE_BEGIN" node_modules/react-native/ReactCommon/react/nativemodule/core/platform/ios/ReactCommon/RCTTurboModule.mm \
            && echo "Patch verified in node_modules." \
            || (echo "::error::RN TurboModule patch missing before pod install — aborting build." && exit 1)

      - name: "Remove blocking crash-report upload (suspected watchdog-timeout cause)"
        run: |
          python3 - <<'PYEOF'
          import base64

          path = "node_modules/react-native/ReactCommon/react/nativemodule/core/platform/ios/ReactCommon/RCTTurboModule.mm"
          with open(path) as f:
              content = f.read()

          VOID_B64 = ""
          PROMISE_B64 = ""

          remove_void = base64.b64decode(VOID_B64).decode("utf-8")
          remove_promise = base64.b64decode(PROMISE_B64).decode("utf-8")

          void_count = content.count(remove_void)
          promise_count = content.count(remove_promise)
          if void_count != 1 or promise_count != 1:
              print(f"::error::Expected exactly 1 occurrence each of the blocking upload blocks (void={void_count}, promise={promise_count}) — patch shape changed, aborting.")
              raise SystemExit(1)

          content = content.replace(remove_void, "").replace(remove_promise, "")

          if "BLACKGYM_CAPTURE_BEGIN" in content:
              print("::error::BLACKGYM_CAPTURE_BEGIN marker still present after removal — something is wrong.")
              raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)

          print("Removed the blocking semaphore-wait crash-report upload from both catch blocks (kept the NSLog-only logging).")
          PYEOF

      - name: "Remove blocking pre-RN crash-report upload from AppDelegate (real root cause of the launch hang)"
        working-directory: expo/ios
        run: |
          python3 - <<'PYEOF'
          path = "BlackGym/AppDelegate.swift"
          with open(path) as f:
              content = f.read()

          anchor = (
              "    CrashDiagnostics.install()\n"
              "    CrashDiagnostics.presentPendingReport()\n"
              "\n"
              "    let delegate = ReactNativeDelegate()"
          )
          count = content.count(anchor)
          if count != 1:
              print(f"::error::Expected exactly 1 occurrence of the presentPendingReport() launch call (found {count}) — AppDelegate.swift shape changed, aborting.")
              raise SystemExit(1)

          patch = (
              "    CrashDiagnostics.install()\n"
              "\n"
              "    let delegate = ReactNativeDelegate()"
          )
          content = content.replace(anchor, patch)

          call_site = "    CrashDiagnostics.presentPendingReport()\n\n    let delegate"
          if call_site in content:
              print("::error::presentPendingReport() call site still present after patch — aborting.")
              raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)

          print("AppDelegate.swift patched: removed the synchronous, main-thread, pre-RN crash-report upload call")
          print("that runs inside didFinishLaunchingWithOptions. This call could block for up to ~30s (2 upload")
          print("attempts x 2 URLs x up to 7s semaphore wait, plus a 3s sleep between attempts) whenever a stale")
          print("blackgym_last_crash.txt file already existed in Documents (written by ANY earlier crash, on ANY")
          print("earlier build, since Documents is never purged across TestFlight updates) - this exactly matches")
          print("the 0x8BADF00D 'scene-create watchdog transgression' kills seen in the real crash logs (~20s wall")
          print("clock, very low CPU = blocked on network I/O, not busy compute). CrashDiagnostics.install() (the")
          print("harmless uncaught-exception logger) is kept; only the blocking upload-before-RN-starts call is removed.")
          PYEOF

      - name: "Add native boot-alive overlay (diagnostic: does ANY custom UI render before JS/React even starts?)"
        working-directory: expo/ios
        run: |
          python3 - <<'PYEOF'
          path = "BlackGym/AppDelegate.swift"
          with open(path) as f:
              content = f.read()

          anchor_var = (
              "  private static var pendingReportWindow: UIWindow?\n"
              "  private static var shouldContinueLaunch = false\n"
          )
          count_var = content.count(anchor_var)
          if count_var != 1:
              print(f"::error::AppDelegate.swift anchor_var not found exactly once (found {count_var}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch_var = (
              "  private static var pendingReportWindow: UIWindow?\n"
              "  private static var shouldContinueLaunch = false\n"
              "  private static var bootAliveWindow: UIWindow?\n"
          )
          content = content.replace(anchor_var, patch_var)

          anchor_func = (
              "  static func install() {\n"
              "    NSSetUncaughtExceptionHandler { exception in\n"
              "      let stack = exception.callStackSymbols.joined(separator: \"\\n\")\n"
              "      let report = \"[Black Gym] Uncaught NSException\\nname: \\(exception.name.rawValue)\\nreason: \\(exception.reason ?? \"(none)\")\\nstack:\\n\\(stack)\"\n"
              "      CrashDiagnostics.handle(report)\n"
              "    }\n"
              "  }\n"
              "\n"
              "  /// Muestra el reporte del último crash (si existe) ANTES de arrancar React"
          )
          count_func = content.count(anchor_func)
          if count_func != 1:
              print(f"::error::AppDelegate.swift anchor_func not found exactly once (found {count_func}) — file shape changed, aborting.")
              raise SystemExit(1)

          new_func = (
              "  /// Diagnóstico temporal: muestra un cartel nativo (fuera de React) apenas\n"
              "  /// arranca la app, con el mismo truco de ventana a windowLevel .alert+1 que\n"
              "  /// ya sabemos que descarta el snapshot del launch screen (lo usa\n"
              "  /// presentPendingReport). No depende de que el bridge de RN ni JS lleguen a\n"
              "  /// correr, así que confirma si ALGO puede pintar en pantalla antes de\n"
              "  /// sospechar de React/JS. A diferencia de presentPendingReport, no bloquea\n"
              "  /// el launch esperando ninguna acción del usuario.\n"
              "  static func showBootAliveOverlay() {\n"
              "    NSLog(\"[Black Gym] boot-alive: esperando UIWindowScene…\")\n"
              "    let sceneDeadline = Date().addingTimeInterval(5)\n"
              "    while Date() < sceneDeadline {\n"
              "      let scenes = UIApplication.shared.connectedScenes.compactMap { $0 as? UIWindowScene }\n"
              "      if let windowScene = scenes.first(where: { $0.activationState == .foregroundActive }) ?? scenes.first {\n"
              "        let window = UIWindow(windowScene: windowScene)\n"
              "        window.frame = windowScene.coordinateSpace.bounds\n"
              "        window.windowLevel = .alert + 1\n"
              "\n"
              "        let vc = UIViewController()\n"
              "        vc.view.backgroundColor = UIColor(red: 0.016, green: 0.016, blue: 0.016, alpha: 1)\n"
              "\n"
              "        let label = UILabel()\n"
              "        label.text = \"Black Gym\\n\\nDiagnóstico nativo: el arranque llegó hasta acá.\\n\\nEste cartel se oculta solo en 6 segundos:\\nmirá qué queda atrás.\"\n"
              "        label.numberOfLines = 0\n"
              "        label.textAlignment = .center\n"
              "        label.textColor = UIColor(red: 0.776, green: 0.945, blue: 0.208, alpha: 1)\n"
              "        label.font = .systemFont(ofSize: 17, weight: .semibold)\n"
              "        label.translatesAutoresizingMaskIntoConstraints = false\n"
              "        vc.view.addSubview(label)\n"
              "\n"
              "        NSLayoutConstraint.activate([\n"
              "          label.centerXAnchor.constraint(equalTo: vc.view.safeAreaLayoutGuide.centerXAnchor),\n"
              "          label.centerYAnchor.constraint(equalTo: vc.view.safeAreaLayoutGuide.centerYAnchor),\n"
              "          label.leadingAnchor.constraint(greaterThanOrEqualTo: vc.view.safeAreaLayoutGuide.leadingAnchor, constant: 24),\n"
              "          label.trailingAnchor.constraint(lessThanOrEqualTo: vc.view.safeAreaLayoutGuide.trailingAnchor, constant: -24),\n"
              "        ])\n"
              "\n"
              "        window.rootViewController = vc\n"
              "        window.makeKeyAndVisible()\n"
              "        window.isHidden = false\n"
              "        window.rootViewController?.view.setNeedsLayout()\n"
              "        window.rootViewController?.view.layoutIfNeeded()\n"
              "\n"
              "        bootAliveWindow = window\n"
              "        NSLog(\"[Black Gym] boot-alive: overlay mostrado\")\n"
              "\n"
              "        // Se oculta solo: si React SÍ llega a montar algo detrás, esto lo deja\n"
              "        // ver. Si sigue todo negro después, React nunca llegó a pintar nada.\n"
              "        DispatchQueue.main.asyncAfter(deadline: .now() + 6) {\n"
              "          window.isHidden = true\n"
              "          bootAliveWindow = nil\n"
              "          NSLog(\"[Black Gym] boot-alive: overlay ocultado tras 6s\")\n"
              "        }\n"
              "        return\n"
              "      }\n"
              "      RunLoop.main.run(mode: .default, before: Date().addingTimeInterval(0.1))\n"
              "    }\n"
              "    NSLog(\"[Black Gym] boot-alive: sin UIWindowScene tras 5s, no se pudo mostrar\")\n"
              "  }\n"
              "\n"
          )

          patch_func = (
              "  static func install() {\n"
              "    NSSetUncaughtExceptionHandler { exception in\n"
              "      let stack = exception.callStackSymbols.joined(separator: \"\\n\")\n"
              "      let report = \"[Black Gym] Uncaught NSException\\nname: \\(exception.name.rawValue)\\nreason: \\(exception.reason ?? \"(none)\")\\nstack:\\n\\(stack)\"\n"
              "      CrashDiagnostics.handle(report)\n"
              "    }\n"
              "  }\n"
              "\n"
              + new_func +
              "  /// Muestra el reporte del último crash (si existe) ANTES de arrancar React"
          )
          content = content.replace(anchor_func, patch_func)

          anchor_call = (
              "    CrashDiagnostics.install()\n"
              "\n"
              "    let delegate = ReactNativeDelegate()"
          )
          count_call = content.count(anchor_call)
          if count_call != 1:
              print(f"::error::AppDelegate.swift anchor_call not found exactly once (found {count_call}) — file shape changed (expected the presentPendingReport() call to already be removed by the previous step), aborting.")
              raise SystemExit(1)

          patch_call = (
              "    CrashDiagnostics.install()\n"
              "    CrashDiagnostics.showBootAliveOverlay()\n"
              "\n"
              "    let delegate = ReactNativeDelegate()"
          )
          content = content.replace(anchor_call, patch_call)

          with open(path, "w") as f:
              f.write(content)

          print("AppDelegate.swift patched: added a temporary native 'boot-alive' overlay shown immediately at launch,")
          print("independent of React/JS, auto-hiding itself after 6s. Reuses the same alert+1 window-level trick")
          print("already proven to escape the launch-screen snapshot. If this text shows up on screen, native")
          print("rendering works fine. What matters most is what's visible AFTER it hides itself: if React mounted")
          print("anything behind it (even our JS boot-trace overlay), it'll show once these 6s pass. If it's still")
          print("solid black afterward, React/JS never painted anything at all. This overlay is diagnostic-only and")
          print("should be removed once the real hang is found and fixed.")
          PYEOF

      - name: "Patch Podfile: force C++17 for fmt pod (Xcode 26 consteval fix)"
        working-directory: expo/ios
        run: |
          python3 - <<'PYEOF'
          import sys

          path = "Podfile"
          with open(path) as f:
              content = f.read()

          anchor = ":ccache_enabled => ccache_enabled?(podfile_properties),\n    )\n  end"
          if anchor not in content:
              print("::error::Podfile post_install anchor not found — Podfile format may have changed, cannot apply fmt fix.")
              sys.exit(1)

          patch = (
              ":ccache_enabled => ccache_enabled?(podfile_properties),\n"
              "    )\n"
              "    installer.pods_project.targets.each do |target|\n"
              "      if target.name == 'fmt'\n"
              "        target.build_configurations.each do |config|\n"
              "          config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'\n"
              "        end\n"
              "      end\n"
              "    end\n"
              "  end"
          )

          content = content.replace(anchor, patch)
          with open(path, "w") as f:
              f.write(content)

          print("Podfile patched: fmt pod forced to build with C++17 (fixes Xcode 26 consteval/FMT_STRING compile error).")
          PYEOF

      - name: Install CocoaPods dependencies
        working-directory: expo/ios
        env:
          RCT_USE_PREBUILT_RNCORE: "0"
          RCT_USE_RN_DEP: "0"
        run: pod install

      - name: Bump build number
        working-directory: expo/ios
        run: /usr/libexec/PlistBuddy -c "Set CFBundleVersion $((1000 + ${{ github.run_number }}))" BlackGym/Info.plist

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          cat > "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" <<'KEYEOF'
          ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEYEOF
          cp "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist
        working-directory: expo/ios
        run: |
          cat > ExportOptions.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>2H88882YG5</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLISTEOF

      - name: Archive
        working-directory: expo/ios
        run: |
          xcodebuild archive \
            -workspace BlackGym.xcworkspace \
            -scheme BlackGym \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BlackGym.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=2H88882YG5

      - name: Export IPA
        working-directory: expo/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BlackGym.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Save build output for debugging (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            expo/ios/*.xcresult
            expo/ios/build
          if-no-files-found: ignore
