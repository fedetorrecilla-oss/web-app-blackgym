              "\n"
              "export const [RutinaProvider, useRutina] = createContextHook(() => {"
          )
          count1 = content.count(anchor1)
          if count1 != 1:
              print(f"::error::RutinaContext.tsx anchor1 not found exactly once (found {count1}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch1 = (
              "const KEYS = {\n"
              "  exercises: 'rutina_exercises',\n"
              "  templates: 'rutina_templates',\n"
              "  days: 'rutina_days',\n"
              "  dayExercises: 'rutina_day_exercises',\n"
              "  workouts: 'rutina_workouts',\n"
              "  workoutSets: 'rutina_workout_sets',\n"
              "  seeded: 'rutina_seeded',\n"
              "} as const;\n"
              "\n"
              "// Black Gym stability patch: see the matching comment in context/GymContext.tsx.\n"
              "// Race every local-storage read against a timeout so a native TurboModule call\n"
              "// that throws internally (leaving its JS promise unsettled) can never hang the\n"
              "// app forever at launch.\n"
              "function safeGetItem(key: string): Promise<string | null> {\n"
              "  return Promise.race([\n"
              "    AsyncStorage.getItem(key),\n"
              "    new Promise<string | null>((resolve) => setTimeout(() => resolve(null), 4000)),\n"
              "  ]);\n"
              "}\n"
              "\n"
              "export const [RutinaProvider, useRutina] = createContextHook(() => {"
          )
          content = content.replace(anchor1, patch1)

          anchor2 = (
              "    queryFn: async () => {\n"
              "      console.log('[RutinaContext] Loading local data...');\n"
              "      const [sExercises, sTemplates, sDays, sDayExercises, sWorkouts, sWorkoutSets, sSeeded] =\n"
              "        await Promise.all([\n"
              "          AsyncStorage.getItem(KEYS.exercises),\n"
              "          AsyncStorage.getItem(KEYS.templates),\n"
              "          AsyncStorage.getItem(KEYS.days),\n"
              "          AsyncStorage.getItem(KEYS.dayExercises),\n"
              "          AsyncStorage.getItem(KEYS.workouts),\n"
              "          AsyncStorage.getItem(KEYS.workoutSets),\n"
              "          AsyncStorage.getItem(KEYS.seeded),\n"
              "        ]);"
          )
          count2 = content.count(anchor2)
          if count2 != 1:
              print(f"::error::RutinaContext.tsx anchor2 not found exactly once (found {count2}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch2 = (
              "    queryFn: async () => {\n"
              "      markCheckpoint('RutinaContext:localData:start');\n"
              "      console.log('[RutinaContext] Loading local data...');\n"
              "      const [sExercises, sTemplates, sDays, sDayExercises, sWorkouts, sWorkoutSets, sSeeded] =\n"
              "        await Promise.all([\n"
              "          safeGetItem(KEYS.exercises),\n"
              "          safeGetItem(KEYS.templates),\n"
              "          safeGetItem(KEYS.days),\n"
              "          safeGetItem(KEYS.dayExercises),\n"
              "          safeGetItem(KEYS.workouts),\n"
              "          safeGetItem(KEYS.workoutSets),\n"
