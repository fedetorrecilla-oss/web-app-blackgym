name: Build and upload to TestFlight

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Apply RN TurboModule crash patch (explicit, fail-fast)
        run: node scripts/patch-rn-turbomodule.js

      - name: Verify the patch actually landed before pod install
        run: |
          grep -q "BLACKGYM_CAPTURE_BEGIN" node_modules/react-native/ReactCommon/react/nativemodule/core/platform/ios/ReactCommon/RCTTurboModule.mm \
            && echo "Patch verified in node_modules." \
            || (echo "::error::RN TurboModule patch missing before pod install — aborting build." && exit 1)

      - name: "Remove blocking crash-report upload (suspected watchdog-timeout cause)"
        run: |
          python3 - <<'PYEOF'
          import base64

          path = "node_modules/react-native/ReactCommon/react/nativemodule/core/platform/ios/ReactCommon/RCTTurboModule.mm"
          with open(path) as f:
              content = f.read()

          VOID_B64 = ""
          PROMISE_B64 = ""

          remove_void = base64.b64decode(VOID_B64).decode("utf-8")
          remove_promise = base64.b64decode(PROMISE_B64).decode("utf-8")

          void_count = content.count(remove_void)
          promise_count = content.count(remove_promise)
          if void_count != 1 or promise_count != 1:
              print(f"::error::Expected exactly 1 occurrence each of the blocking upload blocks (void={void_count}, promise={promise_count}) — patch shape changed, aborting.")
              raise SystemExit(1)

          content = content.replace(remove_void, "").replace(remove_promise, "")

          if "BLACKGYM_CAPTURE_BEGIN" in content:
              print("::error::BLACKGYM_CAPTURE_BEGIN marker still present after removal — something is wrong.")
              raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)

          print("Removed the blocking semaphore-wait crash-report upload from both catch blocks (kept the NSLog-only logging).")
          PYEOF

      - name: "Patch Podfile: force C++17 for fmt pod (Xcode 26 consteval fix)"
        working-directory: expo/ios
        run: |
          python3 - <<'PYEOF'
          import sys

          path = "Podfile"
          with open(path) as f:
              content = f.read()

          anchor = ":ccache_enabled => ccache_enabled?(podfile_properties),\n    )\n  end"
          if anchor not in content:
              print("::error::Podfile post_install anchor not found — Podfile format may have changed, cannot apply fmt fix.")
              sys.exit(1)

          patch = (
              ":ccache_enabled => ccache_enabled?(podfile_properties),\n"
              "    )\n"
              "    installer.pods_project.targets.each do |target|\n"
              "      if target.name == 'fmt'\n"
              "        target.build_configurations.each do |config|\n"
              "          config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'\n"
              "        end\n"
              "      end\n"
              "    end\n"
              "  end"
          )

          content = content.replace(anchor, patch)
          with open(path, "w") as f:
              f.write(content)

          print("Podfile patched: fmt pod forced to build with C++17 (fixes Xcode 26 consteval/FMT_STRING compile error).")
          PYEOF

      - name: Install CocoaPods dependencies
        working-directory: expo/ios
        env:
          RCT_USE_PREBUILT_RNCORE: "0"
          RCT_USE_RN_DEP: "0"
        run: pod install

      - name: Bump build number
        working-directory: expo/ios
        run: /usr/libexec/PlistBuddy -c "Set CFBundleVersion $((1000 + ${{ github.run_number }}))" BlackGym/Info.plist

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          cat > "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" <<'KEYEOF'
          ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEYEOF
          cp "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist
        working-directory: expo/ios
        run: |
          cat > ExportOptions.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>2H88882YG5</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLISTEOF

      - name: Archive
        working-directory: expo/ios
        run: |
          xcodebuild archive \
            -workspace BlackGym.xcworkspace \
            -scheme BlackGym \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BlackGym.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=2H88882YG5

      - name: Export IPA
        working-directory: expo/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BlackGym.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Save build output for debugging (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            expo/ios/*.xcresult
            expo/ios/build
          if-no-files-found: ignore
