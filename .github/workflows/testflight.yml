      - name: "Add boot checkpoints to the login screen (app/index.tsx)"
        run: |
          python3 - <<'PYEOF'
          path = "app/index.tsx"
          with open(path) as f:
              content = f.read()

          anchor0 = (
              "import { ADMIN_PASSWORD } from '@/constants/gym';\n"
              "import { UserRole } from '@/types/gym';\n"
