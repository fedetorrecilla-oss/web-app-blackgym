name: Build and upload to TestFlight

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Add on-screen boot-trace diagnostic overlay (create lib/bootTrace.ts)"
        run: |
          python3 - <<'PYEOF'
          import os

          path = "lib/bootTrace.ts"
          os.makedirs(os.path.dirname(path), exist_ok=True)

          content = (
              "// Black Gym boot-trace: a tiny, always-on checkpoint log so a black-screen\n"
              "// hang can be diagnosed from a screenshot alone, without a crash log or a\n"
              "// connected Mac. Call markCheckpoint(...) at each key startup milestone;\n"
              "// BootTraceOverlay (in app/_layout.tsx) renders the list live on screen.\n"
              "type Checkpoint = { label: string; t: number };\n"
              "\n"
              "const trace: Checkpoint[] = [];\n"
              "let listeners: Array<() => void> = [];\n"
              "\n"
              "export function markCheckpoint(label: string): void {\n"
              "  trace.push({ label, t: Date.now() });\n"
              "  listeners.forEach((listener) => {\n"
              "    try {\n"
              "      listener();\n"
              "    } catch {\n"
              "      // no-op: a broken listener must never break the app it's diagnosing.\n"
              "    }\n"
              "  });\n"
              "}\n"
              "\n"
              "export function getTrace(): Checkpoint[] {\n"
              "  return trace;\n"
              "}\n"
              "\n"
              "export function subscribeTrace(listener: () => void): () => void {\n"
              "  listeners.push(listener);\n"
              "  return () => {\n"
              "    listeners = listeners.filter((l) => l !== listener);\n"
              "  };\n"
              "}\n"
          )

          with open(path, "w") as f:
              f.write(content)

          print("Created lib/bootTrace.ts (checkpoint log used by the on-screen diagnostic overlay).")
          PYEOF

      - name: "Fix silent black-screen hang: never let a stuck native call block first render"
        run: |
          python3 - <<'PYEOF'
          path = "context/GymContext.tsx"
          with open(path) as f:
              content = f.read()

          anchor0 = (
              "import { MAX_CAPACITY, STORAGE_KEYS, DEFAULT_PRICING } from '@/constants/gym';\n"
              "import { trpc } from '@/lib/trpc';\n"
              "\n"
              "function generateId(): string {"
          )
          count0 = content.count(anchor0)
          if count0 != 1:
              print(f"::error::GymContext.tsx anchor0 (import block) not found exactly once (found {count0}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch0 = (
              "import { MAX_CAPACITY, STORAGE_KEYS, DEFAULT_PRICING } from '@/constants/gym';\n"
              "import { trpc } from '@/lib/trpc';\n"
              "import { markCheckpoint } from '@/lib/bootTrace';\n"
              "\n"
              "function generateId(): string {"
          )
          content = content.replace(anchor0, patch0)

          anchor1 = (
              "function generateId(): string {\n"
              "  return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;\n"
              "}\n"
              "\n"
              "export const [GymProvider, useGym] = createContextHook(() => {"
          )
          count1 = content.count(anchor1)
          if count1 != 1:
              print(f"::error::GymContext.tsx anchor1 not found exactly once (found {count1}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch1 = (
              "function generateId(): string {\n"
              "  return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;\n"
              "}\n"
              "\n"
              "// Black Gym stability patch: on some iOS 26 devices a native TurboModule call\n"
              "// (including AsyncStorage.getItem) can throw internally, and the current RN patch\n"
              "// (scripts/patch-rn-turbomodule.js) leaves the corresponding JS promise unsettled\n"
              "// instead of crashing or rejecting -- so an unprotected await here can hang forever\n"
              "// and the app never gets past the loading screen. Race every local-storage read\n"
              "// against a timeout so a stuck native call can never block first render; treat a\n"
              "// timeout the same as \"nothing stored yet\" (same as a fresh install).\n"
              "function safeGetItem(key: string): Promise<string | null> {\n"
              "  return Promise.race([\n"
              "    AsyncStorage.getItem(key),\n"
              "    new Promise<string | null>((resolve) => setTimeout(() => resolve(null), 4000)),\n"
              "  ]);\n"
              "}\n"
              "\n"
              "export const [GymProvider, useGym] = createContextHook(() => {"
          )
          content = content.replace(anchor1, patch1)

          anchor2 = (
              "    queryFn: async () => {\n"
              "      console.log('[GymContext] Loading local data from AsyncStorage...');\n"
              "      const [storedStudents, storedBookings, storedBlocked, storedPayments, storedPricing, storedUser] =\n"
              "        await Promise.all([\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.students),\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.bookings),\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.blockedSlots),\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.payments),\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.pricing),\n"
              "          AsyncStorage.getItem(STORAGE_KEYS.currentUser),\n"
              "        ]);"
          )
          count2 = content.count(anchor2)
          if count2 != 1:
              print(f"::error::GymContext.tsx anchor2 not found exactly once (found {count2}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch2 = (
              "    queryFn: async () => {\n"
              "      markCheckpoint('GymContext:localData:start');\n"
              "      console.log('[GymContext] Loading local data from AsyncStorage...');\n"
              "      const [storedStudents, storedBookings, storedBlocked, storedPayments, storedPricing, storedUser] =\n"
              "        await Promise.all([\n"
              "          safeGetItem(STORAGE_KEYS.students),\n"
              "          safeGetItem(STORAGE_KEYS.bookings),\n"
              "          safeGetItem(STORAGE_KEYS.blockedSlots),\n"
              "          safeGetItem(STORAGE_KEYS.payments),\n"
              "          safeGetItem(STORAGE_KEYS.pricing),\n"
              "          safeGetItem(STORAGE_KEYS.currentUser),\n"
              "        ]);"
          )
          content = content.replace(anchor2, patch2)

          anchor3 = (
              "      console.log('[GymContext] Local data loaded:', {\n"
              "        students: data.students.length,\n"
              "        bookings: data.bookings.length,\n"
              "        payments: data.payments.length,\n"
              "      });\n"
              "\n"
              "      return data;\n"
              "    },\n"
              "    staleTime: Infinity,"
          )
          count3 = content.count(anchor3)
          if count3 != 1:
              print(f"::error::GymContext.tsx anchor3 (return data) not found exactly once (found {count3}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch3 = (
              "      console.log('[GymContext] Local data loaded:', {\n"
              "        students: data.students.length,\n"
              "        bookings: data.bookings.length,\n"
              "        payments: data.payments.length,\n"
              "      });\n"
              "\n"
              "      markCheckpoint('GymContext:localData:done');\n"
              "      return data;\n"
              "    },\n"
              "    staleTime: Infinity,"
          )
          content = content.replace(anchor3, patch3)

          with open(path, "w") as f:
              f.write(content)
          print("GymContext.tsx patched: local-storage reads now time out after 4s, and boot checkpoints added.")
          PYEOF

          python3 - <<'PYEOF'
          path = "context/RutinaContext.tsx"
          with open(path) as f:
              content = f.read()

          anchor0 = (
              "from '@/constants/rutina-templates';\n"
