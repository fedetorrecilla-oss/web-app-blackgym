          )
          content = content.replace(anchor2, patch2)

          anchor3 = (
              "      return {\n"
              "        exercises: parsedExercises,\n"
              "        templates: parsedTemplates,\n"
              "        days: parsedDays,\n"
              "        dayExercises: parsedDayExercises,\n"
              "        workouts: parsedWorkouts,\n"
              "        workoutSets: parsedWorkoutSets,\n"
              "      };\n"
              "    },\n"
              "    staleTime: Infinity,"
          )
          count3 = content.count(anchor3)
          if count3 != 1:
              print(f"::error::RutinaContext.tsx anchor3 (return block) not found exactly once (found {count3}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch3 = (
              "      markCheckpoint('RutinaContext:localData:done');\n"
              "      return {\n"
              "        exercises: parsedExercises,\n"
              "        templates: parsedTemplates,\n"
              "        days: parsedDays,\n"
              "        dayExercises: parsedDayExercises,\n"
              "        workouts: parsedWorkouts,\n"
              "        workoutSets: parsedWorkoutSets,\n"
              "      };\n"
              "    },\n"
              "    staleTime: Infinity,"
          )
          content = content.replace(anchor3, patch3)

          with open(path, "w") as f:
              f.write(content)
          print("RutinaContext.tsx patched: local-storage reads now time out after 4s, and boot checkpoints added.")
          PYEOF

      - name: "Add boot-trace overlay to app/_layout.tsx (always visible, even if something inside hangs)"
        run: |
          python3 - <<'PYEOF'
          path = "app/_layout.tsx"
          with open(path) as f:
              content = f.read()

          anchor0 = (
              "import { trpc, trpcClient } from '@/lib/trpc';\n"
              "\n"
              "const queryClient = new QueryClient();"
          )
          count0 = content.count(anchor0)
          if count0 != 1:
              print(f"::error::_layout.tsx anchor0 (import + queryClient) not found exactly once (found {count0}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch0 = (
              "import { trpc, trpcClient } from '@/lib/trpc';\n"
              "import { markCheckpoint, subscribeTrace, getTrace } from '@/lib/bootTrace';\n"
              "\n"
              "markCheckpoint('module:_layout evaluated');\n"
              "\n"
              "const queryClient = new QueryClient();"
          )
          content = content.replace(anchor0, patch0)

          anchor1 = "function RootLayoutNav() {"
          count1 = content.count(anchor1)
          if count1 != 1:
              print(f"::error::_layout.tsx anchor1 (RootLayoutNav) not found exactly once (found {count1}) — file shape changed, aborting.")
              raise SystemExit(1)

          overlay_block = (
              "// Black Gym diagnostic overlay: always-visible, tiny text trail of startup\n"
              "// checkpoints so a black-screen hang can be diagnosed from a screenshot\n"
              "// alone. Rendered as a sibling of the whole app tree so it still shows up\n"
              "// even if something deeper (a Provider, a query) never finishes.\n"
              "function BootTraceOverlay() {\n"
              "  const [, forceUpdate] = useState(0);\n"
              "\n"
              "  useEffect(() => {\n"
              "    const unsubscribe = subscribeTrace(() => forceUpdate((n) => n + 1));\n"
              "    return unsubscribe;\n"
              "  }, []);\n"
              "\n"
              "  const entries = getTrace();\n"
              "\n"
              "  return (\n"
              "    <View pointerEvents=\"none\" style={overlayStyles.container}>\n"
              "      <Text style={overlayStyles.title}>Black Gym - diagnostico de arranque</Text>\n"
              "      {entries.map((entry, i) => (\n"
              "        <Text key={i} style={overlayStyles.line}>\n"
              "          {i + 1}. {entry.label}\n"
              "        </Text>\n"
              "      ))}\n"
              "    </View>\n"
              "  );\n"
              "}\n"
              "\n"
              "const overlayStyles = StyleSheet.create({\n"
              "  container: {\n"
              "    position: 'absolute',\n"
              "    top: 50,\n"
              "    left: 8,\n"
              "    right: 8,\n"
              "    backgroundColor: 'rgba(0,0,0,0.85)',\n"
              "    borderRadius: 8,\n"
              "    padding: 8,\n"
              "    zIndex: 9999,\n"
              "  },\n"
              "  title: {\n"
              "    color: '#C6F135',\n"
              "    fontSize: 11,\n"
              "    fontWeight: '700' as const,\n"
              "    marginBottom: 4,\n"
              "  },\n"
              "  line: {\n"
              "    color: '#FFFFFF',\n"
              "    fontSize: 10,\n"
              "    fontFamily: 'Menlo',\n"
              "  },\n"
              "});\n"
              "\n"
              "function RootLayoutNav() {"
          )
          content = content.replace(anchor1, overlay_block)

          anchor2 = (
              "export default function RootLayout() {\n"
              "  useEffect(() => {\n"
              "    // Deferred to mount: module-scope native calls crash release builds on\n"
              "    // iOS 26 before the error boundary exists (TurboModule void-method bug).\n"
              "    SplashScreen.preventAutoHideAsync().catch(() => {});\n"
              "    SplashScreen.hideAsync().catch(() => {});\n"
              "  }, []);\n"
              "\n"
              "  return (\n"
              "    <trpc.Provider client={trpcClient} queryClient={queryClient}>\n"
              "      <QueryClientProvider client={queryClient}>\n"
              "        <GestureHandlerRootView style={{ flex: 1 }}>\n"
              "          <GymProvider>\n"
              "            <RutinaProvider>\n"
              "              <RootLayoutNav />\n"
              "            </RutinaProvider>\n"
              "          </GymProvider>\n"
              "        </GestureHandlerRootView>\n"
              "      </QueryClientProvider>\n"
              "    </trpc.Provider>\n"
              "  );\n"
              "}"
          )
          count2 = content.count(anchor2)
          if count2 != 1:
              print(f"::error::_layout.tsx anchor2 (RootLayout body) not found exactly once (found {count2}) — file shape changed, aborting.")
              raise SystemExit(1)

          patch2 = (
              "export default function RootLayout() {\n"
              "  markCheckpoint('RootLayout:render');\n"
              "\n"
              "  useEffect(() => {\n"
              "    // Deferred to mount: module-scope native calls crash release builds on\n"
